[versions]
kotlin = "2.4.10"
agp = "9.1.1"
# The Graphite PoC currently requires the Compose snapshot built against Skiko 0.152.0-alpha01.
compose = "1.12.10-alpha01+snapshot.default"
composeCompiler = "2.4.10"
skikoGraphite = "0.152.0-alpha01"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skikoGraphite" }
skiko-graphite = { module = "org.jetbrains.skiko:skiko-graphite", version.ref = "skikoGraphite" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
